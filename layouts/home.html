{{ define "main" }}

<main>


    <div class="meta">
        <time>{{ .Date.Format "02 Jan 2006" }}</time>
        <div class="wordcount">No. of words: {{ .WordCount }}</div>
    </div>

    {{ .Content }}

    <ol>
        {{ range site.RegularPages.ByDate.Reverse }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a> &mdash;<i>{{ .Date.Format "2 Jan 2006" }}</i></li>
            
        {{ end }}
    </ol>

</main>

{{ end }}
