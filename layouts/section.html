{{ define "main" }}

<main>

    <div class="meta">
        <time>{{ .Date.Format "02 Jan 2006" }}</time>
        <div class="wordcount">No. of words: {{ .WordCount }}</div>
    </div>

    {{ .Content }}

    <section class="section-content">
        <ul>
            {{ range .Pages }}
                <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
            {{ end }}
        </ul>
    </section>

    <!-- This content comes from any _index.md files which are landing pages for specific folders or the home page -->
</main>



{{ end }}
