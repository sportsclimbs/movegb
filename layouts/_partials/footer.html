<footer style="background-image: url(/img/pattern-1.png);
">
    <p>Made with Hugo {{ hugo.Version }}</p>
    <ul class="list">
        {{ range site.Menus.section }}
            <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
    </ul>
    <p>{{ .Title }}<br>{{ .Date.Format "2 Jan 06" }}</p>
    <p>
        The site has {{ len site.RegularPages }} pages.
    </p>
</footer>
